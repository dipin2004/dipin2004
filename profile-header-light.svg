<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="610" viewBox="0 0 1180 610" role="img" aria-label="Dipin Sunny GitHub profile header">
  <defs>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2563EB">
        <animate attributeName="stop-color" values="#2563EB;#06B6D4;#10B981;#2563EB" dur="8s" repeatCount="indefinite"/>
      </stop>
      <stop offset="55%" stop-color="#06B6D4">
        <animate attributeName="stop-color" values="#06B6D4;#10B981;#2563EB;#06B6D4" dur="8s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" stop-color="#10B981">
        <animate attributeName="stop-color" values="#10B981;#2563EB;#06B6D4;#10B981" dur="8s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>
    <radialGradient id="glow1">
      <stop offset="0%" stop-color="#06B6D4" stop-opacity=".22"/>
      <stop offset="100%" stop-color="#06B6D4" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2">
      <stop offset="0%" stop-color="#2563EB" stop-opacity=".18"/>
      <stop offset="100%" stop-color="#2563EB" stop-opacity="0"/>
    </radialGradient>
    <filter id="blur"><feGaussianBlur stdDeviation="26"/></filter>
    <filter id="soft"><feGaussianBlur stdDeviation="6"/></filter>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="12" stdDeviation="18" flood-opacity=".22"/>
    </filter>
    <clipPath id="clip"><rect x="10" y="10" width="1160" height="590" rx="28"/></clipPath>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M24 0H0V24" fill="none" stroke="#0F172A" stroke-opacity=".025"/>
    </pattern>
  </defs>

  <rect width="1180" height="610" rx="28" fill="#FFFFFF"/>
  <g clip-path="url(#clip)">
    <rect x="10" y="10" width="1160" height="590" rx="28" fill="#F8FAFC" stroke="rgba(15,23,42,.10)"/>
    <rect x="10" y="10" width="1160" height="590" fill="url(#grid)"/>

    <circle cx="140" cy="90" r="220" fill="url(#glow1)" filter="url(#blur)">
      <animate attributeName="cx" values="140;250;140" dur="10s" repeatCount="indefinite"/>
    </circle>
    <circle cx="1060" cy="500" r="240" fill="url(#glow2)" filter="url(#blur)">
      <animate attributeName="cy" values="500;420;500" dur="12s" repeatCount="indefinite"/>
    </circle>

    <g opacity=".55">
      <circle cx="75" cy="160" r="2" fill="#06B6D4"><animate attributeName="cy" values="160;145;160" dur="4s" repeatCount="indefinite"/></circle>
      <circle cx="1040" cy="105" r="2" fill="#10B981"><animate attributeName="cy" values="105;120;105" dur="5s" repeatCount="indefinite"/></circle>
      <circle cx="1090" cy="470" r="2" fill="#2563EB"><animate attributeName="cx" values="1090;1070;1090" dur="6s" repeatCount="indefinite"/></circle>
      <circle cx="520" cy="560" r="2" fill="#06B6D4"><animate attributeName="cy" values="560;545;560" dur="4.5s" repeatCount="indefinite"/></circle>
    </g>

    <!-- left ASCII / terminal portrait -->
    <rect x="55" y="72" width="390" height="466" rx="22" fill="#FFFFFF" fill-opacity=".55" stroke="rgba(15,23,42,.10)" filter="url(#shadow)"/>
    <text x="82" y="108" font-family="monospace" font-size="13" fill="#475569">$ whoami</text>
    <text x="82" y="137" font-family="monospace" font-size="18" font-weight="700" fill="#06B6D4">dipin2004</text>
    <text x="82" y="168" font-family="monospace" font-size="13" fill="#475569">$ profile --animate</text>

    <g font-family="monospace" font-size="16" font-weight="700" fill="url(#accent)">
      <text x="90" y="220">        ████████        </text>
      <text x="90" y="242">      ████████████      </text>
      <text x="90" y="264">     ███  ████  ███     </text>
      <text x="90" y="286">     ███████████████     </text>
      <text x="90" y="308">      ████████████      </text>
      <text x="90" y="330">       ██████████       </text>
      <text x="90" y="352">        ████████        </text>
      <text x="90" y="374">      ████████████      </text>
      <text x="90" y="396">     ███  ████  ███     </text>
      <text x="90" y="418">    ████████████████    </text>
    </g>
    <g opacity=".55" stroke="#06B6D4">
      <line x1="75" y1="205" x2="425" y2="205">
        <animate attributeName="y1" values="205;445;205" dur="5s" repeatCount="indefinite"/>
        <animate attributeName="y2" values="205;445;205" dur="5s" repeatCount="indefinite"/>
      </line>
    </g>
    <text x="82" y="470" font-family="monospace" font-size="13" fill="#475569">$ status: building + learning</text>
    <text x="82" y="498" font-family="monospace" font-size="13" fill="#10B981">AI &amp; Automation Testing</text>
    <rect x="82" y="514" width="8" height="17" fill="#06B6D4">
      <animate attributeName="opacity" values="1;0;1" dur="1s" repeatCount="indefinite"/>
    </rect>

    <!-- right content -->
    <text x="490" y="105" font-family="Arial, sans-serif" font-size="17" fill="#475569">Hi 👋</text>
    <text x="490" y="151" font-family="Arial, sans-serif" font-size="44" font-weight="800" fill="#0F172A">I'm Dipin Sunny</text>
    <rect x="490" y="176" width="570" height="2" fill="url(#accent)" opacity=".8">
      <animate attributeName="x" values="490;520;490" dur="4s" repeatCount="indefinite"/>
    </rect>

    <g font-family="monospace" font-size="18" fill="#06B6D4">
      <text x="490" y="220">&gt; AI &amp; Automation Testing<span fill="#0F172A">_</span></text>
      <text x="490" y="220" opacity=".8"><animate attributeName="opacity" values=".2;1;.2" dur="2s" repeatCount="indefinite"/>▌</text>
    </g>

    <g font-family="Arial, sans-serif">
      <text x="490" y="270" font-size="14" fill="#475569">📍 Location</text>
      <text x="650" y="270" font-size="16" fill="#0F172A">Kerala</text>
      <text x="490" y="308" font-size="14" fill="#475569">🎓 Education</text>
      <text x="650" y="308" font-size="16" fill="#0F172A">Viswajyothi College of Engineering</text>
      <text x="490" y="346" font-size="14" fill="#475569">🎯 Current Focus</text>
      <text x="650" y="346" font-size="16" fill="#0F172A">AI &amp; Automation Testing</text>
    </g>

    <text x="490" y="395" font-family="Arial, sans-serif" font-size="14" fill="#475569">SKILLS</text>
    <g font-family="Arial, sans-serif" font-size="14" fill="#0F172A">
      <g>
        <rect x="490" y="412" width="78" height="34" rx="17" fill="#2563EB" fill-opacity=".18" stroke="#2563EB" stroke-opacity=".5"/>
        <text x="529" y="434" text-anchor="middle">Python</text>
      </g>
      <g>
        <rect x="578" y="412" width="68" height="34" rx="17" fill="#06B6D4" fill-opacity=".18" stroke="#06B6D4" stroke-opacity=".5"/>
        <text x="612" y="434" text-anchor="middle">Java</text>
      </g>
      <g>
        <rect x="656" y="412" width="70" height="34" rx="17" fill="#10B981" fill-opacity=".18" stroke="#10B981" stroke-opacity=".5"/>
        <text x="691" y="434" text-anchor="middle">HTML</text>
      </g>
      <g>
        <rect x="736" y="412" width="62" height="34" rx="17" fill="#2563EB" fill-opacity=".18" stroke="#2563EB" stroke-opacity=".5"/>
        <text x="767" y="434" text-anchor="middle">CSS</text>
      </g>
      <g>
        <rect x="808" y="412" width="105" height="34" rx="17" fill="#06B6D4" fill-opacity=".18" stroke="#06B6D4" stroke-opacity=".5"/>
        <text x="860" y="434" text-anchor="middle">JavaScript</text>
      </g>
      <g>
        <rect x="923" y="412" width="57" height="34" rx="17" fill="#10B981" fill-opacity=".18" stroke="#10B981" stroke-opacity=".5"/>
        <text x="951" y="434" text-anchor="middle">Git</text>
      </g>
      <g>
        <rect x="990" y="412" width="57" height="34" rx="17" fill="#2563EB" fill-opacity=".18" stroke="#2563EB" stroke-opacity=".5"/>
        <text x="1018" y="434" text-anchor="middle">SQL</text>
      </g>
    </g>

    <g font-family="monospace" font-size="13" fill="#475569">
      <text x="490" y="490">github.com/dipin2004</text>
      <text x="490" y="518">building projects • learning • exploring AI</text>
    </g>

    <!-- border shimmer -->
    <rect x="10" y="10" width="1160" height="590" rx="28" fill="none" stroke="url(#accent)" stroke-width="2" stroke-dasharray="90 900" opacity=".7">
      <animate attributeName="stroke-dashoffset" from="0" to="-990" dur="6s" repeatCount="indefinite"/>
    </rect>
  </g>
</svg>